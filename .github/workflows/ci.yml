name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, node24
        with:
          python-version-file: .python-version

      - name: Install pinned secret scanner
        run: python ../scripts/security_checks.py install --destination "$RUNNER_TEMP/pinsight-secret-tools"

      - name: Secret scanner rejection checks
        env:
          PINSIGHT_TEST_SCANNER: ${{ runner.temp }}/pinsight-secret-tools/gitleaks
        run: python -m unittest discover -s ../scripts/tests -p test_security_checks.py -v

      - name: Committed history secret scan
        run: python ../scripts/security_checks.py scan --scanner "$RUNNER_TEMP/pinsight-secret-tools/gitleaks"

      - name: Install dependencies
        run: |
          python -m pip --isolated install --require-hashes --no-deps -r requirements-bootstrap.txt
          python -m pip --isolated install --require-hashes --no-deps --no-build-isolation -r requirements-dev-lock.txt
          python -m pip check

      - name: License inventory rejection checks
        run: python -m unittest discover -s ../scripts/tests -p test_license_inventory.py -v

      - name: Development license inventory (not approval)
        run: python ../scripts/license_inventory.py --environment development --output "$RUNNER_TEMP/python-development-licenses.json"

      - name: Runtime-only installation
        run: |
          python -m venv ../.runtime-check
          ../.runtime-check/bin/python -m pip --isolated install --require-hashes --no-deps -r requirements-bootstrap.txt
          ../.runtime-check/bin/python -m pip --isolated install --require-hashes --no-deps --no-build-isolation -r requirements-lock.txt
          ../.runtime-check/bin/python -m pip check
          ../.runtime-check/bin/python ../scripts/license_inventory.py --environment runtime --output "$RUNNER_TEMP/python-runtime-licenses.json"
          APP_ENV=test AUTH_ENABLED=false LOCAL_DB_BOOTSTRAP=false DATABASE_URL=sqlite:///:memory: ../.runtime-check/bin/python - <<'PY'
          from importlib.util import find_spec
          from app.main import app

          assert app is not None
          assert all(find_spec(name) is None for name in ("pytest", "poetry", "pip_audit"))
          PY

      - name: Dependency integrity and advisories
        env:
          POETRY_KEYRING_ENABLED: "false"
          POETRY_VIRTUALENVS_USE_POETRY_PYTHON: "true"
        run: |
          python -m venv ../.dependency-tools
          ../.dependency-tools/bin/python -m pip --isolated install --require-hashes --no-deps -r requirements-bootstrap.txt
          ../.dependency-tools/bin/python -m pip --isolated install --require-hashes --no-deps --no-build-isolation -r requirements-tools-lock.txt
          ../.dependency-tools/bin/python -m pip check
          ../.dependency-tools/bin/python ../scripts/license_inventory.py --environment maintenance --output "$RUNNER_TEMP/python-maintenance-licenses.json"
          ../.dependency-tools/bin/python scripts/export_dependencies.py --check
          ../.dependency-tools/bin/python -m pip_audit --disable-pip --no-deps --strict -r requirements-dev-lock.txt -r requirements-tools-lock.txt -r requirements-bootstrap.txt

      - name: Ruff
        run: ruff check app tests scripts/export_dependencies.py ../scripts/security_checks.py ../scripts/license_inventory.py ../scripts/tests

      - name: Pytest (SQLite)
        run: python -m pytest tests -q

      - name: Migrations and managed staging startup (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/p_insight_ci
          APP_ENV: staging
          AUTH_ENABLED: "true"
          LOCAL_DB_BOOTSTRAP: "false"
          SUPABASE_URL: https://auth.example.invalid
          FRONTEND_URL: https://app.example.invalid
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get("/health").json() == {"status": "healthy"}
              assert client.get("/readiness").status_code == 200
              assert client.get("/api/v1/portfolios/").status_code == 401
              assert client.get("/openapi.json").status_code == 404
          PY

      - name: Retain sanitized Python license inventories
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: python-license-inventory-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-development-licenses.json
            ${{ runner.temp }}/python-runtime-licenses.json
            ${{ runner.temp }}/python-maintenance-licenses.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p_insight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5, node24
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Toolchain rejection checks
        run: pnpm run test:toolchain

      - name: Advisory gate rejection checks
        run: pnpm run test:dependencies

      - name: Dependency patch regression checks
        run: pnpm run test:patches

      - name: Remediation policy rejection checks
        run: pnpm run test:remediation

      - name: License inventory rejection checks
        run: pnpm run test:licenses

      - name: Lint gate rejection checks
        run: pnpm run test:lint

      - name: Lint
        run: pnpm run lint

      - name: Frontend license inventory (not approval)
        run: pnpm run license:inventory "$RUNNER_TEMP/frontend-licenses.json"

      - name: Build
        run: pnpm run build

      - name: Type-check
        run: pnpm run type-check

      - name: Frontend dependency advisories
        run: pnpm run audit:dependencies

      - name: Retain sanitized frontend license inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: frontend-license-inventory-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-licenses.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false
