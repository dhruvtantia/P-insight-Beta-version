name: CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest + alembic)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, node24
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-bootstrap.txt
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Ruff
        run: ruff check app tests

      - name: Pytest (SQLite)
        run: python -m pytest tests -q

      - name: Migrations and managed staging startup (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/p_insight_ci
          APP_ENV: staging
          AUTH_ENABLED: "true"
          LOCAL_DB_BOOTSTRAP: "false"
          SUPABASE_URL: https://auth.example.invalid
          FRONTEND_URL: https://app.example.invalid
        run: |
          python -m alembic upgrade head
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              assert client.get("/health").json() == {"status": "healthy"}
              assert client.get("/readiness").status_code == 200
              assert client.get("/api/v1/portfolios/").status_code == 401
              assert client.get("/openapi.json").status_code == 404
          PY

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p_insight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  frontend:
    name: Frontend (type-check + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, node24
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5, node24
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Toolchain rejection checks
        run: pnpm run test:toolchain

      - name: Build
        run: pnpm run build

      - name: Type-check
        run: pnpm run type-check
