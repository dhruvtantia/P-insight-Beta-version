[project]
name = "p-insight-backend"
version = "0.1.0"
description = "P-Insight Portfolio Analytics Backend"
authors = [{name = "Dhruv Tantia", email = "dhruvtantia6@gmail.com"}]
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.2",
    "starlette==1.3.1",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.48",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pandas==2.3.3",
    "numpy==2.5.1",
    "python-multipart==0.0.32",
    "aiofiles==23.2.1",
    "openpyxl==3.1.5",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.12",
    "pyjwt==2.15.0",
    "cryptography==50.0.0",
    "yfinance==0.2.66",
    "httpx==0.27.2",
    "scipy==1.18.0",
    "scikit-learn==1.9.0",
    # Keep numerical support libraries at the tested baseline too.
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
    "narwhals==2.24.0",
    "anthropic==0.117.0",
    # Security floors for transitive dependencies; re-audit on every update.
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "idna>=3.15,<4",
    "soupsieve>=2.9,<3",
    "urllib3>=2.8,<3",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pytest-asyncio = "1.3.0"
ruff = "0.1.15"
pyyaml = "6.0.3"

[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pip = "26.2.2"
setuptools = "84.2.1"
wheel = "0.48.0"

[tool.poetry.group.lock]
optional = true

[tool.poetry.group.lock.dependencies]
poetry = "2.3.4"
poetry-plugin-export = "1.10.0"
pip-audit = "2.10.1"
virtualenv = ">=21.14.7,<22"

[build-system]
requires = ["poetry-core==2.3.2"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
